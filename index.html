<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input disabled type="text" name="" id="">
        </div>
        <div class="buttons-container">
            <div>

                <button>7</button>
                <button>8</button>
                <button>9</button>
            </div>
            <div>

                <button>4</button>
                <button>5</button>
                <button>6</button>
            </div>
            <div>

                <button>1</button>
                <button>2</button>
                <button>3</button>
            </div>
            <div>

                <button>/</button>
                <button>*</button>
                <button>-</button>
            </div>
            <div>

                <button>+</button>
                <button>=</button>
                <button>x</button>
            </div>
            <div>

                <button>.</button>
                <button>0</button>
            </div>
        </div>
    </div>
    
    <script defer src="script.js"></script>
</body>
</html>
