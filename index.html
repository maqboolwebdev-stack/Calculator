<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css-resets.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap');
    </style>
  </head>
  <body>
    <main class="calculator">
      <h1 class="visually-hidden">Calculator</h1>
      <p class="visually-hidden" id="calculator-instructions">
        Use the number keys and +, -, *, /, and % keys to enter a calculation.
        Press Enter or = to calculate, Backspace to delete, or Escape to clear.
      </p>
      <input
        type="text"
        class="display"
        inputmode="none"
        aria-label="Calculator display"
        aria-describedby="calculator-instructions"
        aria-live="polite"
        autocomplete="off"
        spellcheck="false"
        placeholder="0"
      />
      <div
        class="buttons-container"
        role="group"
        aria-label="Calculator keypad"
        aria-describedby="calculator-instructions"
      >
        <div>
          <button type="button" class="clear" aria-label="Clear all">AC</button>
          <button type="button" class="backspace" aria-label="Backspace">
            <img src="backspace.svg" alt="" aria-hidden="true" />
          </button>
          <button type="button" class="percentage" aria-label="Percent">%</button>
          <button type="button" class="operator" aria-label="Divide">÷</button>
        </div>
        <div>
          <button type="button" class="digits">7</button>
          <button type="button" class="digits">8</button>
          <button type="button" class="digits">9</button>
          <button type="button" class="operator" aria-label="Multiply">×</button>
        </div>
        <div>
          <button type="button" class="digits">4</button>
          <button type="button" class="digits">5</button>
          <button type="button" class="digits">6</button>
          <button type="button" class="operator" aria-label="Subtract">-</button>
        </div>
        <div>
          <button type="button" class="digits">1</button>
          <button type="button" class="digits">2</button>
          <button type="button" class="digits">3</button>
          <button type="button" class="operator" aria-label="Add">+</button>
        </div>
        <div>
          <button type="button" class="digits wide">0</button>
          <button type="button" class="digits decimal" aria-label="Decimal point">.</button>
          <button type="button" class="equal" aria-label="Equals">
            <img src="equal.svg" alt="" aria-hidden="true" />
          </button>
        </div>
      </div>
    </main>

    <script defer src="script.js"></script>
  </body>
</html>
